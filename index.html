<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Time</title>
<style>
  :root{--bg:#fff8ec;--ink:#2b2a33;--mint:#2fb59a;--sun:#ffb938;--berry:#e8556d;--sky:#4a90e2;--card:#fff;--ok:#d9f5e8;--bad:#fde0e3}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--mint);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  header h1{margin:0;font-size:22px;white-space:nowrap}header>div{display:flex;align-items:center;white-space:nowrap}
  #stars{font-weight:bold;background:#ffffff33;border-radius:20px;padding:4px 12px}
  main{max-width:720px;margin:0 auto;padding:16px}
  .card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 3px 10px #0001;margin-bottom:14px}
  h2{margin:0 0 10px;font-size:20px}
  button{font:inherit;border:0;border-radius:14px;padding:12px 16px;font-weight:bold;cursor:pointer;background:var(--sky);color:#fff;margin:4px 4px 4px 0}
  button.alt{background:var(--sun);color:#3a2a00}
  button.green{background:var(--mint)}
  button.red{background:var(--berry)}
  button.ghost{background:var(--soft);color:var(--ink)}
  button:disabled{opacity:.45;cursor:default}
  select,input[type=text],textarea{font:inherit;padding:10px;border-radius:12px;border:2px solid var(--line);width:100%}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .modes button{padding:16px 10px;font-size:17px}
  .lessons button{display:block;width:100%;text-align:left;font-size:19px;padding:16px;margin:0 0 10px;background:var(--sky)}
  .lessons button small{display:block;font-weight:normal;opacity:.9;font-size:14px;margin-top:2px}
  .big{font-size:90px;text-align:center;line-height:1.1;margin:6px 0}
  .word{font-size:32px;text-align:center;font-weight:bold;letter-spacing:1px}
  .es{text-align:center;color:var(--mute);font-size:18px;margin-bottom:8px}
  .center{text-align:center}
  .fb{margin-top:10px;padding:12px;border-radius:12px;font-size:18px;text-align:center}
  .fb.ok{background:var(--ok)}.fb.bad{background:var(--bad)}
  .letters span{display:inline-block;min-width:26px;padding:2px 4px;margin:2px;border-radius:8px;font-size:26px;font-weight:bold}
  .letters .g{background:var(--ok);color:#12775b}.letters .r{background:var(--bad);color:#b3263d}
  .small{font-size:14px;color:var(--mute)}
  .progress{height:10px;background:var(--soft);border-radius:10px;overflow:hidden;margin:6px 0 12px}
  .progress i{display:block;height:100%;background:var(--sun)}
  .picks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
  .pick{font-size:60px;background:var(--surf);border:3px solid var(--line);color:inherit;padding:8px 14px;border-radius:18px}
  .pick.good{background:var(--ok);border-color:var(--mint)}.pick.nope{background:var(--bad);border-color:var(--berry)}
  .opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
  .opt{font-size:20px;background:var(--surf);border:3px solid var(--line);color:inherit;padding:12px 18px}
  .opt.good{background:var(--ok);border-color:var(--mint)}.opt.nope{background:var(--bad);border-color:var(--berry)}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .gal button{background:var(--surf);color:inherit;border:3px solid var(--soft);margin:0;padding:10px}
  .gal .gcard{position:relative}.gal .gcard>button:first-child{width:100%}.gal .gcard .slowbtn{position:absolute;top:3px;right:3px;width:auto;padding:2px 6px;font-size:16px;border:0;background:transparent;box-shadow:none}
  .gal .e{font-size:44px;display:block}.gal .w{display:block;font-size:17px}.gal .s{display:block;font-weight:normal;font-size:13px;color:var(--mute)}
  .slot,.bank{min-height:58px;border-radius:14px;padding:8px;margin:8px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .slot{background:var(--blue);border:2px dashed #9bb8e8}
  .bank{background:var(--soft2)}
  .tile{font-size:20px;background:var(--surf);color:var(--ink);border:3px solid var(--sky);margin:0;padding:8px 14px}
  .tile.on{background:var(--sky);color:#fff}
  /* crossword */
  #grid{display:grid;gap:3px;justify-content:center;margin:10px auto}
  .cell{width:38px;height:38px;position:relative}
  .cell input{width:100%;height:100%;text-align:center;font-size:20px;font-weight:bold;text-transform:uppercase;border:2px solid var(--line);border-radius:6px;padding:0;background:var(--surf)}
  .cell input.ok{background:var(--ok);border-color:#2fb59a}
  .cell input.bad{background:var(--bad);border-color:var(--berry)}
  .cell b{position:absolute;top:1px;left:3px;font-size:10px;color:var(--mute);pointer-events:none}
  .clues{list-style:none;padding:0;margin:8px 0}
  .clues li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:18px}
  .clues .sp{background:none;color:var(--sky);padding:2px 8px;margin:0 0 0 6px}
  .res{display:block;margin:2px 0 0 4px;font-size:17px}
  .res.ok{color:#12775b}.res.bad{color:#b3263d}
  @media (max-width:480px){.cell{width:30px;height:30px}.cell input{font-size:16px}.big{font-size:72px}.pick{font-size:48px}}
  .match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .match>div{display:flex;flex-direction:column;gap:8px}
  .mc{margin:0;background:var(--surf);color:var(--ink);border:3px solid var(--line);font-size:20px;padding:10px;min-height:60px}
  .mc.pic{font-size:40px}
  .mc.sel{border-color:var(--sun);background:var(--sel)}
  .mc.good{background:var(--ok);border-color:var(--mint)}
  .mc.nope{background:var(--bad);border-color:var(--berry)}
  .mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .mcard{margin:0;min-height:76px;font-size:34px;background:var(--sky);color:#fff;padding:4px}
  .mcard.up{background:var(--surf);color:var(--ink);border:3px solid var(--sun)}
  .mcard.wd{font-size:15px}
  .mcard.good{background:var(--ok);color:var(--ink);border:3px solid var(--mint)}
  .lbox{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0}
  .lc{display:inline-block;width:44px;line-height:48px;font-size:30px;font-weight:bold;background:var(--soft);border-radius:10px}
  .lt{width:44px;height:50px;text-align:center;font-size:30px;font-weight:bold;border:3px solid var(--sun);border-radius:10px;padding:0}
  .lt.ok{background:var(--ok);border-color:var(--mint)}.lt.bad{background:var(--bad);border-color:var(--berry)}
  #wsg{display:grid;gap:3px;max-width:400px;margin:10px auto}
  .ws{margin:0;padding:0;aspect-ratio:1;font-size:18px;background:var(--surf);color:var(--ink);border:2px solid var(--line);border-radius:8px}
  .ws.shown{background:#ffe0a8;border-color:var(--sun);color:#2b2a33}.cell input.shown{background:#ffe0a8!important;color:#2b2a33}
  .esbox .esbtn{padding:6px 12px;font-size:15px;margin:2px 0}
  .nose{background:transparent;color:var(--sky);padding:2px 8px;margin-left:6px}
  .ws.sel{background:var(--sun)}.ws.found{background:var(--ok);border-color:var(--mint)}
  @media (max-width:480px){.mem{grid-template-columns:repeat(3,1fr)}}
  .fb.info{background:var(--info)}
  .ans{background:var(--ok);padding:10px;border-radius:12px;font-size:18px;margin:8px 0}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;padding:12px 22px;border-radius:30px;font-size:20px;font-weight:bold;color:#fff;box-shadow:0 6px 18px #0003;transition:all .25s;z-index:50;text-align:center;max-width:90%;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.ok{background:var(--mint)}#toast.bad{background:var(--sky)}
  .conf{position:fixed;top:-30px;font-size:28px;z-index:40;pointer-events:none;animation:fall 1.4s ease-in forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.9}}
  .chip{display:inline-block;background:var(--soft);border-radius:14px;padding:4px 10px;margin:3px 4px 3px 0;font-size:15px}
  .chip.on{background:var(--ok)}
  .bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:15px}
  .bar .lab{width:150px;flex:none}.bar .tr{flex:1;height:14px;background:var(--soft);border-radius:10px;overflow:hidden}
  .bar .tr i{display:block;height:100%;background:var(--sky)}.bar .tr i.hi{background:var(--mint)}.bar .tr i.mid{background:var(--sun)}
  .bar .pc{width:92px;flex:none;text-align:right;color:var(--mute)}
  .days{display:flex;gap:6px;justify-content:center;margin:8px 0}
  .days span{width:38px;height:44px;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--mute)}
  .days span.today{outline:3px solid var(--mint)}
  .days span.fut{opacity:.45}
  .days span.on{background:var(--sun);color:#3a2a00;font-weight:bold}
  .scene{font-size:84px;text-align:center;line-height:1.1;margin:8px 0;background:var(--blue);border-radius:18px;padding:14px}
  @media (max-width:480px){header{padding:12px 10px}header h1{font-size:16px}#stars{padding:4px 8px;font-size:14px}.bar .lab{width:110px}.bar .pc{width:70px}.scene{font-size:64px}}
  .ck{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--soft);border-radius:12px;margin:6px 0;font-size:18px;cursor:pointer;background:var(--surf)}
  .ck input{width:24px;height:24px;flex:none;accent-color:var(--mint)}
  .ck small{display:block;color:var(--mute);font-size:13px}
  .ck.on{border-color:var(--mint);background:var(--okbg)}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tools button{margin:0;padding:14px 8px;font-size:17px}
  body.exam .fb,body.exam #helper,body.exam #help,body.exam #nxt{display:none!important}
  body.exam[data-st="write"] [data-say],body.exam[data-st="letters"] [data-say]{display:none!important}
  body.exam .mc.lk{background:var(--blue2);border-color:#7a9be0}
  .badge{font-weight:bold;color:#2b52b3}
  .grade{font-size:56px;font-weight:bold;text-align:center;margin:6px 0}
  .stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:8px 0}
  .stk button{margin:0;padding:8px 4px;background:var(--surf);color:var(--ink);border:3px solid var(--line);border-radius:16px;font-weight:normal}
  .stk .e{display:block;font-size:44px;line-height:1.1}.stk .w{display:block;font-size:14px;font-weight:bold}.stk .s{display:block;font-size:12px;color:var(--mute)}
  .stk .lock{filter:grayscale(1);opacity:.35}
  .stk .rare{border-color:#4a90e2}.stk .epic{border-color:#ffb938;background:var(--paper)}
  .newstk{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
  .newstk div{background:var(--paper);border:3px solid var(--sun);border-radius:18px;padding:10px 16px;animation:pop .5s ease-out}
  .newstk .e{font-size:56px;display:block}
  @keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  .prow{display:flex;align-items:center;gap:10px;padding:10px;border:3px solid var(--soft);border-radius:14px;margin:8px 0}
  .prow.cur{border-color:var(--mint);background:var(--okbg)}
  .prow .av{font-size:36px}.prow .nm{flex:1;font-size:19px;font-weight:bold}.prow .nm small{display:block;font-weight:normal;color:var(--mute);font-size:13px}
  .prow button{margin:0}
  .avs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.avs button{font-size:28px;background:var(--surf);border:3px solid var(--line);padding:4px 8px;margin:0}.avs button.on{border-color:var(--mint);background:var(--okbg)}
:root{--surf:#fff;--soft:#eee;--soft2:#fafafa;--line:#ddd;--blue:#f3f7ff;--blue2:#e9eefc;--okbg:#effaf5;--paper:#fffbe9;--info:#eef4ff;--sel:#fff4d6;--mute:#666}
  body.dark{--bg:#14161f;--ink:#eceef6;--card:#1f2230;--surf:#2a2e42;--soft:#34384e;--soft2:#252839;--line:#4a5070;--blue:#232a45;--blue2:#2c3556;--okbg:#1c3a31;--paper:#3a3420;--info:#233049;--sel:#4a3d1a;--mute:#b2b8d0;--ok:#1f4d3b;--bad:#5e2a36}
  body.dark .badge{color:#9db8ff}body.dark .letters .g{color:#7ee0b8}body.dark .letters .r{color:#ff9aa8}
  body.hasimg main{background:rgba(255,255,255,.78);border-radius:20px;margin-top:10px}
  body.dark.hasimg main{background:rgba(20,22,31,.78)}
  .thmgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
  .thm{margin:0;min-height:84px;border:4px solid transparent;border-radius:16px;font-size:16px;color:#2b2a33;background:#fff8ec;box-shadow:0 2px 6px #0002}
  .thm .e{display:block;font-size:30px}.thm.on{border-color:var(--mint)}
  .lessons .grpbtn{background:linear-gradient(135deg,#ffe9a8,#ffd1e8);border:3px solid var(--mint);color:#2b2a33}
  .tbl{border-collapse:collapse;margin:8px auto;font-size:24px}.tbl th,.tbl td{border:2px solid var(--line);padding:4px 5px;text-align:center;background:var(--surf)}.tbl th{font-size:15px;font-weight:bold}.tbl th:not(:first-child){font-size:26px}
  .pbar{display:block;margin-top:6px}.pbar .progress{display:block;margin:0 0 2px;background:rgba(255,255,255,.4)}.pbar .pl{display:block;font-size:13px;font-weight:bold}
  .lessons .grpbtn .pbar .progress,.card .pbar .progress{background:rgba(120,120,120,.28)}.lessons button .pbar .progress{background:rgba(255,255,255,.4)}.lessons .grpbtn .pbar .progress{background:rgba(120,120,120,.28)}
  .streak{margin-top:10px;text-align:center}.streak .sd{font-size:24px;letter-spacing:2px;margin-bottom:2px}
  .dot{display:inline-block;width:.92em;height:.92em;border-radius:50%;box-shadow:0 0 0 2px rgba(120,120,120,.6);margin:0 .06em;vertical-align:-0.1em}
  #chk::after,#cwcheck::after,#nxt.green::after{content:" ↵";opacity:.75}
  textarea{min-height:110px;font-family:monospace}
</style>
</head>
<body>
<header><h1>🌟 English Time</h1><div><button id="profbtn" class="ghost" style="margin:0 6px 0 0;padding:6px 10px" title="Menú">🦊</button><button id="stkhead" class="ghost" style="margin:0 6px 0 0;padding:6px 10px" title="Pegatinas">🎒</button><button id="mute" class="ghost" style="margin:0 8px 0 0;padding:6px 10px" title="Sonidos">🔊</button><span id="stars">⭐ 0</span></div></header><div id="toast"></div>
<main id="main"></main>

<script>
/* =========================================================
   LECCIONES  (aquí se añaden nuevas lecciones)
   vocab:     [inglés, español, emoji]
   sentences: frases para ordenar
   gaps:      frases con hueco
   qa:        pregunta, answers (respuestas correctas), wrong (incorrectas)
   cross:     (opcional) palabras sueltas para el crucigrama
   ========================================================= */
var LESSONS = [
{
  id:"pets", hidden:true, icon:"🐾", title:"Mascotas", desc:"Vocabulario de animales de compañía + have / has",
  scenes:[
    {pic:"👧🐶",q:"Does she have a dog?",es:"¿Ella tiene un perro?",sub:"she",aux:"does",yes:true,note:"La niña está con un perro."},
    {pic:"👦🐱",q:"Does he have a dog?",es:"¿Él tiene un perro?",sub:"he",aux:"does",yes:false,note:"El niño tiene un gato, no un perro."},
    {pic:"👫🐰",q:"Do they have a rabbit?",es:"¿Ellos tienen un conejo?",sub:"they",aux:"do",yes:true,note:"Los dos están con un conejo."},
    {pic:"👧🐟",q:"Does she have a bird?",es:"¿Ella tiene un pájaro?",sub:"she",aux:"does",yes:false,note:"La niña tiene un pez, no un pájaro."},
    {pic:"🐱🐟",q:"Does the cat like fish?",es:"¿Al gato le gusta el pescado?",sub:"it",aux:"does",yes:true,note:"El gato está comiendo pescado."},
    {pic:"🐶🐱",q:"Do the dog and the cat play together?",es:"¿El perro y el gato juegan juntos?",sub:"they",aux:"do",yes:false,note:"El perro y el gato están separados, no juegan."}
  ],
  rule:{title:"Have / has",text:"🔹 <b>I / you / we / they</b> → <b>have</b><br>🔹 <b>he / she / it</b> → <b>has</b><br>🔹 Después de <b>does</b> se usa <b>have</b>: <i>Does she have a dog?</i><br>🔹 Respuesta corta: <i>Yes, she does.</i> / <i>No, she doesn't.</i>",say:["I have a dog.","She has a cat.","Does she have a dog?"]},
  tip:{title:"Have / Has 🐾",text:"I / you / we / they → <b>have</b><br>he / she / it → <b>has</b>",say:["I have a dog.","She has a cat."]},
  vocab:[["dog","perro","🐶"],["cat","gato","🐱"],["rabbit","conejo","🐰"],["fish","pez","🐟"],["bird","pájaro","🐦"],["hamster","hámster","🐹"],["turtle","tortuga","🐢"],["horse","caballo","🐴"],["parrot","loro","🦜"],["mouse","ratón","🐭"]],
  sentences:[
    {en:"I have a dog.",es:"Tengo un perro."},
    {en:"My cat is very small.",es:"Mi gato es muy pequeño."},
    {en:"She has a white rabbit.",es:"Ella tiene un conejo blanco."},
    {en:"The fish is in the water.",es:"El pez está en el agua."},
    {en:"We feed the birds every day.",es:"Damos de comer a los pájaros cada día."}
  ],
  gaps:[
    {s:"I ___ a dog.",options:["have","has"],answer:"have",es:"Yo tengo un perro."},
    {s:"She ___ a cat.",options:["have","has"],answer:"has",es:"Ella tiene un gato."},
    {s:"The parrot ___ green.",options:["is","are"],answer:"is",es:"El loro es verde."},
    {s:"They ___ two rabbits.",options:["have","has"],answer:"have",es:"Ellos tienen dos conejos."},
    {s:"My turtle ___ very slow.",options:["is","are"],answer:"is",es:"Mi tortuga es muy lenta."}
  ],
  qa:[
    {q:"Do you have a pet?",es:"¿Tienes una mascota?",answers:["Yes, I do.","No, I don't."],wrong:["Yes, I does.","No, I doesn't."]},
    {q:"Is your dog big?",es:"¿Tu perro es grande?",answers:["Yes, it is.","No, it isn't."],wrong:["Yes, it does.","No, it doesn't."]},
    {q:"Does your cat like fish?",es:"¿A tu gato le gusta el pescado?",answers:["Yes, it does.","No, it doesn't."],wrong:["Yes, it is.","No, it isn't."]},
    {q:"Can a parrot talk?",es:"¿Puede hablar un loro?",answers:["Yes, it can.","No, it can't."],wrong:["Yes, it is.","No, it isn't."]},
    {q:"Do you like dogs?",es:"¿Te gustan los perros?",answers:["Yes, I do.","No, I don't."],wrong:["Yes, I am.","No, I'm not."]}
  ]
},
{
  id:"do", hidden:true, icon:"🎾", title:"El verbo To DO", desc:"Do / does en preguntas, respuestas y frases negativas",
  scenes:[
    {pic:"👦💻",q:"Does he play tennis?",es:"¿Él juega al tenis?",sub:"he",aux:"does",yes:false,note:"El niño está en el ordenador, no juega al tenis."},
    {pic:"👧🎾",q:"Does she play tennis?",es:"¿Ella juega al tenis?",sub:"she",aux:"does",yes:true,note:"La niña juega al tenis."},
    {pic:"👧📺",q:"Does she watch TV?",es:"¿Ella ve la tele?",sub:"she",aux:"does",yes:true,note:"La niña está viendo la tele."},
    {pic:"👦🚴",q:"Does he ride a bike?",es:"¿Él monta en bici?",sub:"he",aux:"does",yes:true,note:"El niño va en bici."},
    {pic:"👦🎵",q:"Does he play soccer?",es:"¿Él juega al fútbol?",sub:"he",aux:"does",yes:false,note:"El niño escucha música, no juega al fútbol."},
    {pic:"👫⚽",q:"Do they play soccer?",es:"¿Ellos juegan al fútbol?",sub:"they",aux:"do",yes:true,note:"Los dos juegan al fútbol."},
    {pic:"👫📺",q:"Do they ride bikes?",es:"¿Ellos montan en bici?",sub:"they",aux:"do",yes:false,note:"Los dos ven la tele, no van en bici."},
    {pic:"👧📚",q:"Does she read a book?",es:"¿Ella lee un libro?",sub:"she",aux:"does",yes:true,note:"La niña está leyendo."}

/* ===== lo que ya sabe (barra de progreso por unidad) ===== */
function itemKeys(st){
  var k=[];if(!st)return k;
  if(st.w)k.push("w:"+norm(st.w[0]));
  if(st.s)k.push("s:"+norm(st.s.en));
  if(st.g)k.push("g:"+norm(st.g.s));
  if(st.q)k.push("q:"+norm(st.q.q));
  if(st.sc)k.push("q:"+norm(st.sc.q));
  return k;
}
function knownDates(v){return Array.isArray(v)?v:(v?["antes"]:[]);}
function isLearned(v){return v===1||(Array.isArray(v)&&(v.indexOf("L")>=0||v.indexOf("antes")>=0||v.length>=2));}
function markKnown(st){
  var ks=itemKeys(st);if(!ks.length||!PROG.known)return;
  var t=today(),lesson=!(L&&L.only);
  ks.forEach(function(x){
    var a=knownDates(PROG.known[x]).slice();
    if(lesson){if(a.indexOf("L")<0)a.push("L");}
    else if(a.indexOf(t)<0)a.push(t);
    PROG.known[x]=a.indexOf("L")>=0?["L"]:a.slice(-2);
  });
  psave("et_prog",PROG);try{checkStickers();}catch(e){}
}
function unmarkKnown(st){var ks=itemKeys(st);if(!ks.length||!PROG.known)return;ks.forEach(function(x){delete PROG.known[x];});}
function unitKeys(l){
  var o={};
  (l.vocab||[]).forEach(function(w){o["w:"+norm(w[0])]=1;});
  (l.sentences||[]).forEach(function(x){o["s:"+norm(x.en)]=1;});
  (l.qa||[]).forEach(function(x){o["q:"+norm(x.q)]=1;});
  (l.scenes||[]).forEach(function(x){o["q:"+norm(x.q)]=1;});
  return Object.keys(o);
}
function pctOf(keys){
  var n=0,h=0;keys.forEach(function(k){var v=PROG.known&&PROG.known[k];if(isLearned(v))n++;else if(knownDates(v).length)h++;});
  var T=keys.length;
  return {n:n,half:h,total:T,pct:T?Math.round(n/T*100):0,halfPct:T?Math.round(h/T*100):0};
}
function unitPct(l){return pctOf(unitKeys(l));}
function groupPct(g){var o={};groupUnits(g).forEach(function(u){unitKeys(u).forEach(function(k){o[k]=1;});});return pctOf(Object.keys(o));}
function pbar(p){return '<span class="pbar"><span class="progress"><i style="width:'+p.pct+'%"></i></span><span class="pl">'+p.pct+'% aprendido'+(p.pct===100?' 🌟':'')+'</span></span>';}

/* ===== racha de días seguidos ===== */
var STREAKMS=[[3,"fire","una pegatina especial"],[7,"star","una pegatina especial"],[14,"medal","una pegatina épica"],[30,"diamond","una pegatina épica"]];
function dkey(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function streakInfo(){
  var now=new Date(),d=new Date(now.getFullYear(),now.getMonth(),now.getDate()),doneToday=!!(PROG.days&&PROG.days[dkey(d)]);
  if(!doneToday)d.setDate(d.getDate()-1);
  var n=0,start=null;
  while(PROG.days&&PROG.days[dkey(d)]){n++;start=dkey(d);d.setDate(d.getDate()-1);}
  return {n:n,start:start,doneToday:doneToday};
}
function nextMs(n){for(var i=0;i<STREAKMS.length;i++)if(STREAKMS[i][0]>n)return STREAKMS[i];return null;}
function streakReward(){
  var si=streakInfo();if(!si.n||!si.doneToday)return;
  STREAKMS.forEach(function(m){
    if(si.n>=m[0]&&!PROG.stickers[m[1]]){giveSticker(m[1]);if(L){L.streakWin=L.streakWin||[];L.streakWin.push(m[0]);}}
  });
  psave("et_prog",PROG);
}
function streakHtml(win){
  if(!win||!win.length)return "";
  var n=win[win.length-1];
  return '<div class="card center" style="background:#fff1e0;border:3px solid #ff9a3c"><div class="big">🔥</div><h2>¡'+n+' días seguidos estudiando!</h2><p>¡Increíble constancia! Te ganaste una pegatina por la racha 🎁</p></div>';
}
function streakLine(){
  var si=streakInfo(),nx=nextMs(si.n),tot=nx?nx[0]:si.n,dots="";
  if(nx){for(var i=1;i<=tot;i++)dots+=i<=si.n?"🔥":"⚪";}
  var txt;
  if(!si.n)txt='Empieza hoy tu racha: <b>'+STREAKMS[0][0]+' días seguidos</b> = una pegatina 🎁';
  else{
    txt='<b>'+si.n+' '+(si.n===1?"día seguido":"días seguidos")+'</b>'+(nx?' · a los <b>'+nx[0]+' días</b>: '+nx[2]+' 🎁':' · ¡eres una máquina!');
    if(!si.doneToday)txt+='<br>👉 ¡Estudia hoy para no perder tu racha!';
  }
  return '<div class="streak">'+(dots?'<div class="sd">'+dots+'</div>':'')+'<div class="small">'+txt+'</div></div>';
}

/* ===== utilidades ===== */
function isHex(e){return /^#[0-9a-fA-F]{6}$/.test(e);}
function pic(e){return isHex(e)?'<span class="dot" style="background:'+e+'"></span>':esc(e);}
function emo(e){return isHex(e)?"●":e;}
function cap(n,lo,hi,f){return Math.max(lo,Math.min(hi,Math.round(n*f)));}
function chunks(a,n,maxc){var o=[];for(var i=0;i+3<=a.length&&o.length<maxc;i+=n){var c=a.slice(i,i+n);if(c.length>=3)o.push(c);}return o;}
function wordLv(w){return w[3]||1;}
function filterWords(arr){var m=Math.max.apply(null,lvSel());return (arr||[]).filter(function(w){return wordLv(w)<=m;});}
function $(id){return document.getElementById(id);}
function esHtml(es){if(!es||(L&&L.exam))return "";return '<div class="es esbox"><button class="ghost esbtn" data-es="'+esc(es)+'">👁 Ver en español</button></div>';}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function norm(s){return String(s).toLowerCase().replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim();}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}

function region(v){var m=/^en[-_]([A-Za-z]{2})/i.exec(v.lang);return m?m[1].toUpperCase():"";}
function scoreVoice(v){
  var n=0,rg=region(v),gb=accent()==="gb";
  if(rg==="GB")n+=gb?8:2;else if(rg==="US")n+=gb?1:8;else if(rg==="IE"||rg==="AU")n+=gb?3:1;
  if(/natural|neural|online|premium|enhanced/i.test(v.name))n+=5;
  if(/Samantha|Ava|Allison|Jenny|Aria|Zira|Hazel|Susan|George|Libby|Sonia|Daniel|Serena|Kate|Google US English|Google UK English Female/i.test(v.name))n+=2;
  if(honorsRate(v))n+=4;

function bestVoices(){return enVoices().sort(function(a,b){return scoreVoice(b)-scoreVoice(a);});}
function pickVoice(needRate){

  var chosen=load("et_voice",null),base=chosen?vs.filter(function(v){return v.name===chosen;})[0]:null;
  if(!base)base=vs[0];

}
function needsRate(r){return Math.abs(r-1)>0.05;}
/* lectura lenta: voz que respete la velocidad; si no hay, palabra por palabra con pausas */
var FUNCW={a:1,an:1,the:1,is:1,are:1,am:1,to:1,in:1,on:1,at:1,of:1,and:1,any:1,some:1,he:1,she:1,it:1,i:1,you:1,we:1,they:1,do:1,does:1,doesnt:1,dont:1,can:1,my:1,her:1,his:1,our:1,your:1,their:1,not:1,no:1,yes:1,very:1,too:1,like:1};
function chunkPhrases(text){
  var w=text.split(/\s+/).filter(Boolean);if(w.length<=3)return [text];
  var out=[],i=0;
  while(i<w.length){
    var j=Math.min(i+2,w.length);
    while(j<w.length&&FUNCW[w[j-1].toLowerCase().replace(/[^a-z]/g,"")]&&j-i<4)j++;
    out.push(w.slice(i,j).join(" "));i=j;
  }
  if(out.length>1&&out[out.length-1].split(" ").length===1){var last=out.pop();out[out.length-1]+=" "+last;}
  return out;
}
function speakSlow(text,tok){
  var v=pickVoice(true);
  if(honorsRate(v)||!v){speechSynthesis.speak(mkUtt(text,SLOWRATE,v));return;}
  var words=chunkPhrases(text);
  if(words.length<2)words=text.indexOf(" ")<0?[text,text]:[text];
  (function next(i){
    if(tok!==speakTok||i>=words.length)return;
    var u=mkUtt(words[i],0.7,v);u.onend=function(){setTimeout(function(){next(i+1);},380);};
    speechSynthesis.speak(u);
  })(0);
}
function speak(text,rate,force){
  if(L&&L.exam&&!force)return;
  if(!hasTTS)return;
  lastSpoken={text:text,rate:rate,t:Date.now()};
  try{
    speechSynthesis.cancel();speakTok++;
    var slow=(rate||0.85)<0.8;
    if(slow)speakSlow(text,speakTok);
    else{var r=normalRate();speechSynthesis.speak(mkUtt(text,r,pickVoice(needsRate(r))));}
  }catch(e){}
}
function speakQueued(text,rate){
  if(!hasTTS)return;
  try{
    var slow=(rate||0.85)<0.8,r=slow?SLOWRATE:normalRate();
    speechSynthesis.speak(mkUtt(text,r,pickVoice(needsRate(r))));
  }catch(e){}
}
function speakAt(text,rate,queue){

  try{if(!queue){speechSynthesis.cancel();speakTok++;}speechSynthesis.speak(mkUtt(text,rate,pickVoice(needsRate(rate))));}catch(e){}
}

    r.onresult=function(e){var a=[];for(var i=0;i<e.results[0].length;i++)a.push(e.results[0][i].transcript);cb(null,a);};

function spokenMatches(alts,target){

}
function spokenMatchesAny(alts,list){return list.some(function(t){return spokenMatches(alts,t);});}

function ac(){

function outNode(c){
  if(!c._out){
    var comp=c.createDynamicsCompressor();
    comp.threshold.value=-14;comp.knee.value=12;comp.ratio.value=6;comp.attack.value=0.003;comp.release.value=0.2;
    var g=c.createGain();g.gain.value=1;comp.connect(g);g.connect(c.destination);c._out=comp;c._master=g;
  }
  c._master.gain.value=vol();
  return c._out;
}
function tone(freq,t,dur,type,v,slideTo,cutoff){
  var c=ac();if(!c)return;var out=outNode(c);
  var o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter(),t0=c.currentTime+t;
  o.type=type||"triangle";o.frequency.setValueAtTime(freq,t0);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  f.type="lowpass";f.frequency.value=cutoff||5000;
  g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(v||0.3,t0+0.02);
  g.gain.setValueAtTime(v||0.3,t0+Math.max(0.03,dur*0.6));
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(f);f.connect(g);g.connect(out);o.start(t0);o.stop(t0+dur+0.05);
}

var EASYG={match:"Unir",memory:"Memoria",search:"Sopa de letras"},WRITEG={write:"Escribir",letters:"Letras que faltan",cross:"Crucigrama"};
function easyState(sec){var e=PROG.easy||(PROG.easy={});return e[sec]||(e[sec]={perf:{},lock:{},done:{}});}
function easyLocked(sec,mode){return !!(PROG.easy&&PROG.easy[sec]&&PROG.easy[sec].lock&&PROG.easy[sec].lock[mode]);}
function anyLock(x){return Object.keys(x.lock).some(function(k){return x.lock[k];});}
function easyFinish(){
  var only=L&&L.only,sec=L&&L.title;if(!only||!sec||(L.part!==null&&L.part!==undefined))return "";
  var x=easyState(sec),out="";
  if(EASYG[only]){
    if(L.easyBad)x.perf[only]=0;else x.perf[only]=(x.perf[only]||0)+1;
    if(x.perf[only]>=2){
      x.lock[only]=true;x.perf[only]=0;x.done={};
      out='<div class="card center" style="background:var(--paper);border:3px solid var(--sun)"><div class="big">🌟</div><h2>¡Ya dominas «'+EASYG[only]+'» en este tema!</h2><p>Lo hiciste perfecto dos veces seguidas. Ahora toca <b>escribir</b> ✍️ para aprender de verdad: prueba <b>Escribir</b>, <b>Letras que faltan</b> y <b>Crucigrama</b>.</p><p class="small">«'+EASYG[only]+'» se bloquea en este tema hasta que las hagas.</p></div>';
    }else if(!L.easyBad){
      out='<div class="fb info" style="margin-top:8px">💡 ¡Perfecto! Si lo haces otra vez sin errores, pasarás a practicar <b>escribiendo</b> ✍️</div>';
    }
  }else if(WRITEG[only]&&anyLock(x)){
    var ok=only==="cross"?L.stars>=1:L.stars>=Math.ceil(L.steps.length/2);
    if(ok){
      x.done[only]=true;
      if(x.done.write&&x.done.letters&&x.done.cross){x.lock={};x.perf={};x.done={};out='<div class="card center" style="background:var(--okbg);border:3px solid var(--mint)"><div class="big">🔓</div><h2>¡Desbloqueado!</h2><p>Ya practicaste escribiendo en este tema. Unir, Memoria y Sopa de letras vuelven a estar libres.</p></div>';}
      else{var miss=Object.keys(WRITEG).filter(function(k){return !x.done[k];}).map(function(k){return WRITEG[k];});out='<div class="fb info" style="margin-top:8px">🔒 ¡Muy bien! Para desbloquear los juegos te falta: <b>'+miss.join(", ")+'</b></div>';}
    }else out='<div class="fb info" style="margin-top:8px">Para que cuente, tienes que acertar al menos la mitad a la primera. ¡Inténtalo otra vez! 💪</div>';
  }
  psave("et_prog",PROG);return out;
}

function usableCross(words){return (words||[]).filter(function(x){return /^[a-z]{3,10}$/.test(norm(x[0]));});}
function buildStepsRaw(les,part){
  var v=les.vocab||[],cw=les.cross||v,sg=usableCross(cw);
  function W(n){return shuffle(v).slice(0,n);}
  function p1(){
    var r=[];
    (les.tips||(les.tip?[les.tip]:[])).forEach(function(t){r.push({t:"tip",tip:t});});
    if(v.length){
      r.push({t:"gallery",words:v});
      W(cap(v.length,6,12,0.4)).forEach(function(w){r.push({t:"hearpick",w:w,pool:v});});
      chunks(shuffle(v),6,3).forEach(function(c){r.push({t:"match",words:c});});
      if(v.length>=3)W(cap(v.length,4,8,0.2)).forEach(function(w){r.push({t:"tf",w:w,pool:v});});
      W(cap(v.length,6,12,0.4)).forEach(function(w){r.push({t:"write",w:w});});
    }
    return r;
  }
  function p2(){
    var r=[];
    shuffle(les.sentences||[]).forEach(function(x){r.push({t:"order",s:x});});
    shuffle(les.gaps||[]).forEach(function(g){r.push({t:"gap",g:g});});
    shuffle(les.sentences||[]).slice(0,4).forEach(function(x){r.push({t:"dictation",s:x});});
    shuffle(les.seqs||[]).forEach(function(x){r.push({t:"seq",s:{en:x.en,es:x.es},title:x.title});});
    return r;
  }
  function p3(){
    var r=[],qa=shuffle(les.qa||[]);
    qa.forEach(function(q){r.push({t:"qachoose",q:q});});
    qa.forEach(function(q){r.push({t:"qaorder",q:q});});
    qa.forEach(function(q){r.push({t:"qatype",q:q});});
    var sc=shuffle(les.scenes||[]);
    sc.forEach(function(x){r.push({t:"scenechoose",sc:x});});
    sc.forEach(function(x){r.push({t:"scenetype",sc:x});});
    return r;
  }
  function p4(){
    var r=[];
    shuffle(sg).slice(0,cap(sg.length,5,10,0.3)).forEach(function(w,i){r.push({t:"letters",w:w,miss:missFor(i)});});
    chunks(shuffle(v),6,2).forEach(function(c){r.push({t:"memory",words:c});});
    if(sg.length>=3)for(var k1=0;k1<(sg.length>=14?2:1);k1++)r.push({t:"search",words:sg});
    if(sg.length>=3)for(var k2=0;k2<(sg.length>=18?2:1);k2++)r.push({t:"cross",words:cw});
    if(les.ccross&&usableCross(les.ccross).length>=3)r.push({t:"cross",words:les.ccross});
    return r;
  }
  switch(part){
    case "p1":return p1();
    case "p2":return p2();
    case "p3":return p3();
    case "p4":return p4();
    case "learn":return v.length?[{t:"gallery",words:v}]:[];
    case "write":return shuffle(v).slice(0,15).map(function(w){return {t:"write",w:w};});
    case "speak":return SR?shuffle(v).slice(0,10).map(function(w){return {t:"speak",w:w};}):[{t:"nospeech"}];
    case "cross":return sg.length>=3?[{t:"cross",words:cw}]:[];
    case "match":return chunks(shuffle(v),6,3).map(function(c){return {t:"match",words:c};});
    case "memory":return chunks(shuffle(v),6,2).map(function(c){return {t:"memory",words:c};});
    case "letters":return shuffle(sg).slice(0,10).map(function(w){return {t:"letters",w:w};});
    case "search":return sg.length>=3?[{t:"search",words:sg}]:[];
    default:return p1().concat(p2(),p3(),p4());
  }
}

var LVINFO={1:["🌱 Básico","Reconocer y elegir"],2:["🌿 Medio","Escribir y ordenar"],3:["🌳 Avanzado","Dictado largo y responder sola"]};
function lvSel(){var a=pload("et_lv",[1,2,3]);return (a&&a.length)?a:[1,2,3];}
function missFor(i){var o=lvSel();return o[i%o.length];}
function levelOf(st){
  switch(st.t){
    case "tip":case "gallery":case "examintro":case "nospeech":return 0;
    case "hearpick":case "tf":case "match":case "memory":case "search":case "gap":case "qachoose":case "scenechoose":return 1;
    case "letters":return st.miss===1?1:st.miss===2?2:3;
    case "order":return st.s.en.split(" ").length<=4?1:2;
    case "dictation":return st.s.en.split(" ").length<=4?2:3;
    case "qatype":case "scenetype":return 3;
    default:return 2;
  }
}
function filterLv(steps){

function stepKey(st){if(st.k)return st.k;return st.t+"|"+JSON.stringify(st.w||st.s||st.g||st.q||st.sc||st.words||"",function(k,v){return k==="_lid"?undefined:v;});}
function stepLid(st){return (st.s&&st.s._lid)||(st.g&&st.g._lid)||(st.q&&st.q._lid)||(st.sc&&st.sc._lid)||null;}

function markWeak(st,strong){

  else{

    PROG.weak.push(c);if(PROG.weak.length>60)PROG.weak.shift();psave("et_prog",PROG);
  }
  var lab=stepLabel(st);L.struggled=L.struggled||[];
  if(!L.struggled.some(function(x){return x.txt===lab.txt;}))L.struggled.push(lab);
  if(L.part!=="review"&&(st.rep||0)<(strong?2:1)){
    var copy=JSON.parse(JSON.stringify(st));copy.rep=(st.rep||0)+1;delete copy.queued;
    L.steps.splice(Math.min(L.i+4,L.steps.length),0,copy);

function dots(e){var g=goal(),o=Math.min(e.ok||0,g),r="";for(var i=0;i<g;i++)r+=i<o?"●":"○";return r;}
function masterStep(st){

  if(!only&&les.id)markPart(les.id,part,L.stars);
  if(L.plan&&L.plan.grp&&part==="plan")L.plan.lessons.forEach(function(id){(L.plan.parts||[]).forEach(function(p){markPart(id,p,0);});});
  if(part==="review"&&L.steps.length>=3){starsData.total=(starsData.total||0)+3;psave("et_stars",starsData);L.stars+=3;updateStars();}
  var easyMsg=easyFinish();
  markDay();earnFinish();
  var sg=L.struggled||[];
  var struggled=sg.length?'<div class="fb info" style="text-align:left"><b>🔁 Esto te costó, ¡repásalo!</b><ul class="clues">'+sg.map(function(x){return '<li>'+esc(x.txt)+' <button class="sp" data-say="'+esc(x.say)+'">🔊</button></li>';}).join("")+'</ul>Lo que no sabes se guarda en <b>Repasar lo que no sé</b> hasta que lo aprendas.</div>':
    (part==="review"?'':'<div class="fb ok">🌟 ¡No te quedó nada pendiente!</div>');
  var left=PROG.weak.length;
  main.innerHTML='<div class="card center"><div class="big">🎉</div><h2>¡Terminaste!</h2><p>Ganaste <b>'+L.stars+' ⭐</b> en esta práctica.</p>'+(part==="review"?'<p>🔁 ¡Ronda de repaso completa! Incluye <b>+3 ⭐</b> de premio por repasar.</p>':'')+'</div>'+easyMsg+streakHtml(L.streakWin)+newStickersHtml(L.newStickers,L.levelUp)+'<div class="card center">'+struggled+
    '<div style="margin-top:10px"><button class="green" id="again">Repetir</button>'+
    (left?'<button class="red" id="rev">🔁 Repasar lo que no sé ('+left+')</button>':"")+
    (only||part==="review"||part==="plan"?'':'<button class="alt" id="parts">Elegir otra parte</button>')+'<button class="ghost" id="homebtn2">Inicio</button></div></div>';
  var plan=L.plan;
  $("again").onclick=function(){if(part==="review"){if(left)startReview();else home();}else if(part==="plan")startPlan(plan);else if(only)startSection(only);else startLesson(les,part);};
  if($("rev"))$("rev").onclick=startReview;
  if($("toalbum"))$("toalbum").onclick=stickerScreen;
  if($("parts"))$("parts").onclick=function(){lessonMenu(les);};
  $("homebtn2").onclick=home;
}

R.gaptype=function(st){
  var g=st.g,tries=0,done=false,parts=g.s.split("___");
  var hear=[parts[0].trim(),(parts[1]||"").trim()].filter(function(x){return /[A-Za-z]/.test(x);}).join(" , ");
  shell('<div class="card"><h2>✍️ Escribe la palabra que falta</h2><div class="word" style="font-size:26px">'+esc(parts[0])+'<span id="blank">____</span>'+esc(parts[1]||"")+'</div>'+esHtml(g.es)+

    '<input type="text" id="ans" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Escribe la palabra…" style="text-align:center;font-size:24px;margin-top:8px">'+
    '<div class="center"><button class="green" id="chk">Comprobar</button></div><div id="fb"></div></div>');

};

/* ----- ordenar palabras (frases y respuestas) ----- */
function orderUI(o){
  var toks=o.sentence.split(" "),tiles,placed=[],tries=0;
  var guard=0;
  do{tiles=shuffle(toks.map(function(t,i){return {id:i,t:t};}));guard++;}
  while(toks.length>1&&guard<20&&tiles.map(function(x){return x.t;}).join(" ")===o.sentence);
  shell('<div class="card"><h2>'+o.title+'</h2>'+(o.q?'<div class="word" style="font-size:26px">'+esc(o.q)+'</div>':'')+
    (o.say?'<div class="center"><button class="alt" data-say="'+esc(o.say)+'">🔊 Escuchar</button></div>':'')+
    esHtml(o.hint||"")+'<div id="slot" class="slot"></div><div id="bank" class="bank"></div>'+
    '<div class="center"><button class="green" id="chk">Comprobar</button><button class="ghost" id="clr">Borrar</button></div><div id="fb"></div></div>');
  if(o.say)autoSay(o.say);
  function draw(){
    $("slot").innerHTML=placed.map(function(p){return '<button class="tile on" data-id="'+p.id+'">'+esc(p.t)+'</button>';}).join("");
    $("bank").innerHTML=tiles.filter(function(t){return placed.indexOf(t)<0;}).map(function(t){return '<button class="tile" data-id="'+t.id+'">'+esc(t.t)+'</button>';}).join("");
  }
  function byId(id){return tiles.filter(function(t){return String(t.id)===id;})[0];}
  $("bank").onclick=function(e){var b=e.target.closest(".tile");if(!b||$("chk").disabled)return;var tk=byId(b.getAttribute("data-id"));placed.push(tk);draw();speak(tk.t,0.85);};
  $("slot").onclick=function(e){var b=e.target.closest(".tile");if(!b||$("chk").disabled)return;placed.splice(placed.indexOf(byId(b.getAttribute("data-id"))),1);draw();};
  $("clr").onclick=function(){if($("chk").disabled)return;placed=[];draw();$("fb").innerHTML="";};
  $("chk").onclick=function(){
    if(placed.length<tiles.length){$("fb").innerHTML='<div class="fb info">Usa todas las palabras 🙂</div>';return;}
    var ans=placed.map(function(p){return p.t;}).join(" ");
    if(norm(ans)===norm(o.sentence)){
      if(tries===0)addStar(1);
      $("fb").innerHTML='<div class="fb ok">✅ ¡Perfecto! <b>'+esc(o.sentence)+'</b></div>'+nextBtn();bindNext();
      $("chk").disabled=true;speak(o.sentence,0.85);
    }else{
      tries++;
      $("fb").innerHTML='<div class="fb bad">❌ Todavía no.'+(tries>=2?' Así va: <b>'+esc(o.sentence)+'</b>':' Prueba otra vez.')+'</div>'+(tries>=2?'<div class="center"><button class="ghost" id="nxt">Siguiente →</button></div>':'');
      bindNext();
    }
  };
  draw();
}

R.qatype=function(st){
  var q=st.q,tries=0,done=false;
  shell('<div class="card"><h2>🗣️ Ahora responde tú</h2><div class="word" style="font-size:26px">'+esc(q.q)+'</div>'+esHtml(q.es)+(L&&L.exam?'':'<p class="small" style="margin:4px 0">💡 Aquí vale Yes o No: fíjate bien en el verbo (do, does, am…)</p>')+
    '<div class="center"><button class="alt" data-say="'+esc(q.q)+'">🔊 Escuchar otra vez</button></div>'+
    '<input type="text" id="ans" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Escribe tu respuesta (Yes… / No…)" style="text-align:center;font-size:22px;margin-top:8px">'+
    '<div class="center"><button class="green" id="chk">Comprobar</button>'+(SR?'<button class="red" id="mic">🎤 Responder hablando</button>':'')+'</div><div id="fb"></div></div>');
  autoSay(q.q);
  var inp=$("ans");
  function ok(txt){
    done=true;if(tries===0)addStar(1);
    $("fb").innerHTML='<div class="fb ok">✅ ¡Muy bien! <b>'+esc(txt)+'</b></div>'+nextBtn();bindNext();
    $("chk").disabled=true;inp.disabled=true;speak(txt,0.85);
  }
  function wrong(extra){
    tries++;
    $("fb").innerHTML='<div class="fb bad">❌ Casi. '+(extra||"")+(tries>=2?'<br>Una respuesta correcta: <b>'+esc(q.answers[0])+'</b>':'')+'</div>'+
      '<div class="center">'+(tries>=2?'<button class="ghost" id="nxt">Siguiente →</button>':'')+'</div>';
    bindNext();
  }
  function check(){
    if(done||!norm(inp.value))return;
    var n=norm(inp.value),hit=q.answers.filter(function(a){return norm(a)===n;})[0];
    if(hit)ok(hit);else wrong("Revisa el verbo y las palabras.");
  }
  inp.onkeydown=function(e){if(e.key==="Enter")check();};
  $("chk").onclick=check;inp.focus();
  if(SR&&$("mic"))$("mic").onclick=function(){
    $("fb").innerHTML='<div class="fb">🎧 Te escucho…</div>';
    listen(function(err,alts){

    });
  };
};

function tblHtml(t){
  return '<div style="overflow-x:auto"><table class="tbl"><tr><th></th>'+t.foods.map(function(f){return '<th>'+esc(f)+'</th>';}).join("")+'</tr>'+
    t.people.map(function(p){return '<tr><th>'+esc(p.n)+'</th>'+p.f.map(function(x){return '<td>'+(x?'😊':'☹️')+'</td>';}).join("")+'</tr>';}).join("")+'</table></div>';
}
function sceneVis(sc){return sc.tbl?tblHtml(sc.tbl):'<div class="scene">'+esc(sc.pic)+'</div>';}
function sceneAns(sc){return sc.yes?("Yes, "+sc.sub+" "+sc.aux+"."):("No, "+sc.sub+" "+(sc.aux==="does"?"doesn't":"don't")+".");}
function sceneOpts(sc){
  var other=sc.aux==="does"?"do":"does",negOk=sc.aux==="does"?"doesn't":"don't",negBad=sc.aux==="does"?"don't":"doesn't";
  return shuffle(["Yes, "+sc.sub+" "+sc.aux+".","No, "+sc.sub+" "+negOk+".","Yes, "+sc.sub+" "+other+".","No, "+sc.sub+" "+negBad+"."]);
}

/* ----- sopa de letras ----- */
function genSearch(words){
  var list=shuffle(words.map(function(x){return {en:norm(x[0]),es:x[1],em:x[2],raw:x};})).slice(0,6);
  var maxLen=Math.max.apply(null,list.map(function(w){return w.en.length;}));
  var N=Math.max(8,Math.min(10,maxLen+2)),dirs=[[0,1],[1,0],[1,1]],best=null;
  for(var attempt=0;attempt<30;attempt++){
    var g=[];for(var i=0;i<N;i++){g.push([]);for(var j=0;j<N;j++)g[i].push("");}
    var placed=[];
    list.slice().sort(function(a,b){return b.en.length-a.en.length;}).forEach(function(w){
      for(var t=0;t<80;t++){
        var d=dirs[Math.floor(Math.random()*dirs.length)],r=Math.floor(Math.random()*N),c=Math.floor(Math.random()*N);
        var er=r+d[0]*(w.en.length-1),ec=c+d[1]*(w.en.length-1);
        if(er>=N||ec>=N)continue;
        var ok=true;
        for(var k=0;k<w.en.length;k++){var ch=g[r+d[0]*k][c+d[1]*k];if(ch&&ch!==w.en[k]){ok=false;break;}}
        if(!ok)continue;
        for(var k2=0;k2<w.en.length;k2++)g[r+d[0]*k2][c+d[1]*k2]=w.en[k2];
        placed.push({w:w,r:r,c:c,d:d});return;
      }
    });
    if(!best||placed.length>best.placed.length)best={g:g,placed:placed,N:N};
    if(placed.length===list.length)break;
  }
  var abc="abcdefghijklmnopqrstuvwxyz";
  for(var i2=0;i2<best.N;i2++)for(var j2=0;j2<best.N;j2++)if(!best.g[i2][j2])best.g[i2][j2]=abc[Math.floor(Math.random()*26)];
  return best;
}
var WS=null;
R.search=function(st){
  var ws=genSearch(st.words),found={},count=0,shownN=0,sel=null;WS=ws;
  var cells="";
  for(var r=0;r<ws.N;r++)for(var c=0;c<ws.N;c++)cells+='<button class="ws" data-r="'+r+'" data-c="'+c+'">'+esc(ws.g[r][c].toUpperCase())+'</button>';
  var items=ws.placed.map(function(p,i){return '<li>'+pic(p.w.em)+' '+esc(p.w.es)+' <span class="small">('+p.w.en.length+' letras)</span> <span id="wr'+i+'"></span> <button class="sp nose" data-ns="'+i+'">🤷 No sé</button></li>';}).join("");
  shell('<div class="card"><h2>🔍 Sopa de letras</h2><p class="small">Toca la primera letra y luego la última letra de la palabra (en inglés). Pueden ir en horizontal, vertical o diagonal, en cualquier sentido.</p>'+
    '<div id="wsg" style="grid-template-columns:repeat('+ws.N+',1fr)">'+cells+'</div><ul class="clues">'+items+'</ul><div id="fb"></div></div>'+nextBtn("Continuar →"));
  bindNext();
  function cell(r,c){return main.querySelector('.ws[data-r="'+r+'"][data-c="'+c+'"]');}
  main.querySelectorAll(".ws").forEach(function(b){b.onclick=function(){
    var r=+b.getAttribute("data-r"),c=+b.getAttribute("data-c");
    if(!sel){sel={r:r,c:c};b.classList.add("sel");return;}
    var r1=sel.r,c1=sel.c;cell(r1,c1).classList.remove("sel");sel=null;
    var dr=r-r1,dc=c-c1;
    if((dr===0&&dc===0)||!(dr===0||dc===0||Math.abs(dr)===Math.abs(dc)))return;
    var len=Math.max(Math.abs(dr),Math.abs(dc))+1,sr=Math.sign(dr),sc=Math.sign(dc),str="",pos=[];
    for(var k=0;k<len;k++){var rr=r1+sr*k,cc=c1+sc*k;str+=ws.g[rr][cc];pos.push([rr,cc]);}
    var rev=str.split("").reverse().join("");
    ws.placed.forEach(function(p,i){
      if(found[i])return;
      if(p.w.en===str||p.w.en===rev){
        found[i]=true;count++;
        pos.forEach(function(q){cell(q[0],q[1]).classList.add("found");});
        $("wr"+i).innerHTML='✅ <b>'+esc(p.w.en)+'</b>';ding();speak(p.w.en,0.85);
        var nb=main.querySelector('[data-ns="'+i+'"]');if(nb)nb.remove();
        checkDone();
      }
    });
  };});
  function checkDone(){
    if(count+shownN<ws.placed.length)return;
    if(shownN===0){addStar(3);$("fb").innerHTML='<div class="fb ok">🎉 ¡Encontraste todas!</div>';}
    else $("fb").innerHTML='<div class="fb info">🌱 ¡Terminaste! Las palabras que no sabías quedaron en <b>Repasar lo que no sé</b> 🔁</div>';
  }
  main.querySelectorAll("[data-ns]").forEach(function(b){b.onclick=function(){
    var i=+b.getAttribute("data-ns"),p=ws.placed[i];if(found[i])return;
    found[i]=true;shownN++;
    for(var k=0;k<p.w.en.length;k++)cell(p.r+p.d[0]*k,p.c+p.d[1]*k).classList.add("shown");
    $("wr"+i).innerHTML='🔤 <b>'+esc(p.w.en.split("").join(" · ").toUpperCase())+'</b> <button class="sp" data-say="'+esc(p.w.en)+'">🔊</button>';
    b.remove();if(L)L.easyBad=true;weakWord(p.w.raw);speak(p.w.en,0.75);checkDone();
  };});
};

/* ===== LECCIÓN PERSONALIZADA Y PRUEBA FINAL ===== */
function tagged(arr,id){return (arr||[]).map(function(x){var c={};for(var k in x)c[k]=x[k];c._lid=id;return c;});}
function mergeLessons(sel){
  var m={id:null,icon:"📋",desc:"",vocab:[],sentences:[],gaps:[],qa:[],scenes:[],cross:[],tips:[],seqs:[],ccross:[]},rules=[],names=[],seen={};
  function addVocab(arr){(arr||[]).forEach(function(w){if(!seen[w[0]]){seen[w[0]]=1;m.vocab.push(w);}});}
  (sel.lessons||[]).forEach(function(id){
    var l=LESSONS.filter(function(x){return x.id===id;})[0];if(!l)return;
    names.push(l.title);addVocab(l.vocab);
    m.sentences=m.sentences.concat(tagged(l.sentences,id));m.gaps=m.gaps.concat(tagged(l.gaps,id));
    m.qa=m.qa.concat(tagged(l.qa,id));m.scenes=m.scenes.concat(tagged(l.scenes,id));
    m.cross=m.cross.concat(l.cross||l.vocab||[]);m.seqs=m.seqs.concat(l.seqs||[]);m.ccross=m.ccross.concat(l.ccross||[]);
    if(l.tip)m.tips.push(l.tip);if(l.rule||l.tip)rules.push(l.rule||l.tip);
  });
  var secs=sections();
  (sel.sections||[]).forEach(function(n){if(secs[n]){var fw=filterWords(secs[n]);names.push(n);addVocab(fw);m.cross=m.cross.concat(fw);}});
  m.title=names.join(" + ")||"Mi lección";
  if(rules.length)m.rule={title:"Reglas",text:rules.map(function(r){return "<b>"+esc(r.title)+"</b><br>"+r.text;}).join("<hr>"),say:[].concat.apply([],rules.map(function(r){return r.say||[];}))};
  return m;
}
var PARTNAMES={p1:"Palabras",p2:"Frases",p3:"Preguntas y respuestas",p4:"Juegos de letras"};
function planSteps(m,parts){
  var st=[];["p1","p2","p3","p4"].forEach(function(p){if(parts.indexOf(p)>=0)st=st.concat(buildSteps(m,p));});
  return st;
}
function capSteps(steps,n){
  var idx=[];steps.forEach(function(x,i){if(!NOSCORE[x.t])idx.push(i);});
  if(idx.length<=n)return steps;
  var keep={};shuffle(idx).slice(0,n).forEach(function(i){keep[i]=1;});
  return steps.filter(function(x,i){return NOSCORE[x.t]||keep[i];});
}
function groupSteps(m,sel){
  if(!sel.grp)return planSteps(m,sel.parts||[]);
  var st=[];(sel.parts||[]).forEach(function(p){st=st.concat(capSteps(buildSteps(m,p),24));});return st;
}
function startPlan(sel){
  var m=mergeLessons(sel),steps=groupSteps(m,sel);
  if(!steps.length)return false;
  L={title:m.title,les:m,steps:steps,i:0,stars:0,part:"plan",only:null,plan:sel};renderStep();return true;
}
function selSummary(sel){
  var m=mergeLessons(sel);return {title:m.title,parts:(sel.parts||[]).map(function(p){return PARTNAMES[p];}).join(", ")};
}

/* --- prueba final --- */
function buildExam(m){
  var v=m.vocab,sg=usableCross(m.cross.length?m.cross:v),steps=[];
  function pickN(a,n){return shuffle(a).slice(0,n);}
  function S1(txt){return "Hoja 1 · "+txt;}
  function S2(txt){return "Hoja 2 · "+txt;}
  var s1=[],s2=[];
  if(v.length>=3)s1.push({t:"match",words:pickN(v,6),sheet:1,sec:S1("A. Une cada dibujo con su palabra")});
  if(v.length>=3)pickN(v,4).forEach(function(w){s1.push({t:"hearpick",w:w,pool:v,sheet:1,sec:S1("B. Escucha y elige el dibujo")});});
  pickN(sg,5).forEach(function(w,i){s1.push({t:"letters",w:w,miss:missFor(i),sheet:1,sec:S1("C. Completa las letras que faltan")});});
  pickN(v,5).forEach(function(w){s1.push({t:"write",w:w,sheet:1,sec:S1("D. Escribe lo que ves")});});
  var sen=shuffle(m.sentences);
  pickN(m.gaps,6).forEach(function(g){s2.push({t:"gap",g:g,sheet:2,sec:S2("E. Completa la frase")});});
  sen.slice(0,4).forEach(function(x){s2.push({t:"order",s:x,sheet:2,sec:S2("F. Ordena la frase")});});
  shuffle(m.seqs||[]).slice(0,1).forEach(function(x){s2.push({t:"seq",s:{en:x.en,es:x.es},title:x.title,sheet:2,sec:S2("F2. Ordena la lista")});});
  sen.slice(-4).forEach(function(x){s2.push({t:"dictation",s:x,sheet:2,sec:S2("G. Dictado")});});
  var qa=shuffle(m.qa);
  qa.slice(0,3).forEach(function(q){s2.push({t:"qachoose",q:q,sheet:2,sec:S2("H. Pregunta y respuesta (elige)")});});
  qa.slice(-3).forEach(function(q){s2.push({t:"qatype",q:q,sheet:2,sec:S2("I. Pregunta y respuesta (escribe)")});});
  var sc=shuffle(m.scenes);
  sc.slice(0,3).forEach(function(x){s2.push({t:"scenechoose",sc:x,sheet:2,sec:S2("J. Mira el dibujo y responde (elige)")});});
  sc.slice(-3).forEach(function(x){s2.push({t:"scenetype",sc:x,sheet:2,sec:S2("K. Mira el dibujo y responde (escribe)")});});
  var intro1={t:"examintro",title:"📄 Hoja 1 (por delante): Vocabulario",text:"Tienes <b>una sola oportunidad</b> en cada pregunta. No hay ayudas y la corrección sale <b>al final</b>. Las preguntas se leen en voz alta y puedes pulsar 🔊 para oírlas otra vez.",sheet:1};
  var intro2={t:"examintro",title:"📄 Hoja 2 (por detrás): Frases y preguntas",text:"¡Gira la hoja! Ahora vienen frases, dictado y preguntas con dibujos. Misma regla: una oportunidad por pregunta.",sheet:2};
  s1=filterLv(s1);s2=filterLv(s2);
  if(s1.length)steps=steps.concat([intro1],s1);
  if(s2.length)steps=steps.concat([intro2],s2);
  return steps;
}
function startExam(sel){
  var m=mergeLessons(sel),steps=buildExam(m);
  if(steps.filter(function(x){return x.t!=="examintro";}).length<5)return false;
  L={title:"Prueba final 📝",les:m,steps:steps,i:0,stars:0,part:"exam",exam:true,examLog:[],examBusy:false,only:null,plan:sel};renderStep();return true;
}

function examHit(ok){

function matchExam(st){

    var n=0;

    });

    $("exdone").disabled=Object.keys(pairs).length<words.length;
  }
  function unlink(side,k){
    if(side==="p")delete pairs[k];
    else Object.keys(pairs).forEach(function(pk){if(pairs[pk]===k)delete pairs[pk];});
  }
  main.querySelectorAll(".mc").forEach(function(b){b.onclick=function(){
    var side=b.getAttribute("data-s"),k=b.getAttribute("data-k");
    var linked=side==="p"?(k in pairs):Object.keys(pairs).some(function(pk){return pairs[pk]===k;});
    if(linked&&!sel){unlink(side,k);render();return;}
    if(!sel){sel=b;render();return;}
    if(sel===b){sel=null;render();return;}
    if(sel.getAttribute("data-s")===side){sel=b;render();return;}
    var pk=side==="p"?k:sel.getAttribute("data-k"),wk=side==="w"?k:sel.getAttribute("data-k");
    unlink("p",pk);unlink("w",wk);pairs[pk]=wk;sel=null;render();
  };});
  $("exdone").onclick=function(){

  };

function addWeakOnly(st){

function resizeImage(file,cb){
  var r=new FileReader();

    im.onload=function(){
      var max=1280,k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      cb(null,c.toDataURL("image/jpeg",0.75));
    };
    im.onerror=function(){cb("No pude leer esa imagen. Prueba con otra (JPG o PNG).");};
    im.src=r.result;
  };
  r.onerror=function(){cb("No pude abrir el archivo.");};
  r.readAsDataURL(file);
}

/* ===== copia del progreso ===== */
function exportData(){
  var o={app:"english-time",v:1,date:today(),keys:{}};
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^(et_|p\d+_et_)/.test(k))o.keys[k]=localStorage.getItem(k);}}catch(e){}
  return JSON.stringify(o);
}
function importData(txt){
  var o;try{o=JSON.parse(txt);}catch(e){return "El texto no es una copia válida.";}
  if(!o||o.app!=="english-time"||!o.keys||typeof o.keys!=="object")return "Esto no parece una copia de English Time.";
  try{
    var del=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^(et_|p\d+_et_)/.test(k))del.push(k);}
    del.forEach(function(k){localStorage.removeItem(k);});
    Object.keys(o.keys).forEach(function(k){if(/^(et_|p\d+_et_)/.test(k))localStorage.setItem(k,o.keys[k]);});
  }catch(e){return "No se pudo guardar en este navegador.";}
  PF=load("et_profiles",null);custom=load("et_custom",{});soundOn=load("et_sound",true);
  initProfiles();loadProfileData();updateStars();setMuteIcon();
  return "";
}

    '<button class="green" id="dl">⬇ Descargar copia</button><button class="alt" id="cp">📋 Copiar el código</button><div id="bmsg"></div>'+

    }catch(e){$("bmsg").innerHTML='<div class="fb info">No se pudo descargar aquí. Copia el código de abajo.</div>';}
  };
  $("cp").onclick=function(){
    var t=$("outTxt");t.value=exportData();t.select();
    try{navigator.clipboard.writeText(t.value).then(function(){$("bmsg").innerHTML='<div class="fb ok">✅ Código copiado. Pégalo en una nota o correo.</div>';},function(){$("bmsg").innerHTML='<div class="fb info">Selecciona el texto de abajo y cópialo.</div>';});}
    catch(e){$("bmsg").innerHTML='<div class="fb info">Selecciona el texto de abajo y cópialo.</div>';}
  };
  $("fl").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$("inTxt").value=r.result;};r.readAsText(f);};
  $("rs").onclick=function(){

/* ===== CRUCIGRAMA ===== */
function genCrossword(words){
  var list=usableCross(words).map(function(x){return {en:norm(x[0]),es:x[1],em:x[2],raw:x};});
  list=shuffle(list).slice(0,9).sort(function(a,b){return b.en.length-a.en.length;});
  var grid={},placed=[];
  function get(r,c){return grid[r+","+c];}
  function canPlace(word,r,c,dir){
    var dr=dir==="down"?1:0,dc=dir==="across"?1:0,inter=0;
    if(get(r-dr,c-dc)||get(r+dr*word.length,c+dc*word.length))return -1;
    for(var i=0;i<word.length;i++){
      var rr=r+dr*i,cc=c+dc*i,ex=get(rr,cc);
      if(ex){if(ex!==word[i])return -1;inter++;}
      else{
        if(dir==="across"&&(get(rr-1,cc)||get(rr+1,cc)))return -1;
        if(dir==="down"&&(get(rr,cc-1)||get(rr,cc+1)))return -1;
      }
    }
    return inter;
  }
  function put(item,r,c,dir){
    var dr=dir==="down"?1:0,dc=dir==="across"?1:0;
    for(var i=0;i<item.en.length;i++)grid[(r+dr*i)+","+(c+dc*i)]=item.en[i];
    placed.push({item:item,r:r,c:c,dir:dir});
  }
  list.forEach(function(item,idx){
    if(idx===0){put(item,0,0,"across");return;}
    var best=null;
    placed.forEach(function(p){
      for(var i=0;i<item.en.length;i++)for(var j=0;j<p.item.en.length;j++){
        if(item.en[i]!==p.item.en[j])continue;
        var dir=p.dir==="across"?"down":"across";
        var r=p.dir==="across"?p.r-i:p.r+j,c=p.dir==="across"?p.c+j:p.c-i;
        var sc=canPlace(item.en,r,c,dir);
        if(sc>=1&&(!best||sc>best.sc))best={r:r,c:c,dir:dir,sc:sc};
      }
    });
    if(best)put(item,best.r,best.c,best.dir);
  });
  var minR=Infinity,minC=Infinity,maxR=-Infinity,maxC=-Infinity;
  Object.keys(grid).forEach(function(k){var p=k.split(",").map(Number);minR=Math.min(minR,p[0]);minC=Math.min(minC,p[1]);maxR=Math.max(maxR,p[0]);maxC=Math.max(maxC,p[1]);});
  placed.forEach(function(p){p.r-=minR;p.c-=minC;});
  return {placed:placed,rows:maxR-minR+1,cols:maxC-minC+1};
}

var CW=null,curDir="across";
R.cross=function(st){
  CW=genCrossword(st.words);
  for(var t=0;t<25;t++){var cand=genCrossword(st.words);if(cand.placed.length>CW.placed.length)CW=cand;}
  var starts={},n=0,cells={},rewarded=false;
  CW.placed.slice().sort(function(a,b){return a.r-b.r||a.c-b.c;}).forEach(function(p){
    var k=p.r+","+p.c;if(!starts[k])starts[k]=++n;p.num=starts[k];
  });
  CW.placed.forEach(function(p){
    for(var i=0;i<p.item.en.length;i++){
      var r=p.r+(p.dir==="down"?i:0),c=p.c+(p.dir==="across"?i:0),k=r+","+c;
      cells[k]=cells[k]||{ch:p.item.en[i],words:[]};cells[k].words.push(p.dir);
    }
  });
  CW.cells=cells;
  var html='<div class="card"><h2>🧩 Crucigrama</h2><div id="grid" style="grid-template-columns:repeat('+CW.cols+',auto)">';
  for(var r=0;r<CW.rows;r++)for(var c=0;c<CW.cols;c++){
    var k=r+","+c;
    html+=cells[k]?'<div class="cell">'+(starts[k]?'<b>'+starts[k]+'</b>':'')+'<input maxlength="1" data-r="'+r+'" data-c="'+c+'" autocomplete="off" autocapitalize="characters"></div>':'<div class="cell"></div>';
  }
  html+='</div><div class="center"><button class="green" id="cwcheck">✔ Comprobar</button>'+(L.only==="cross"?'<button class="alt" id="cwnew">🔀 Otro crucigrama</button>':'')+'</div><div id="cwfb"></div>'+
    '<h2>Pistas</h2><ul class="clues">';
  CW.placed.slice().sort(function(a,b){return a.num-b.num||(a.dir==="across"?-1:1);}).forEach(function(p,idx){
    p.idx=idx;
    html+='<li id="clue'+idx+'"><b>'+p.num+(p.dir==="across"?" →":" ↓")+'</b> '+pic(p.item.em)+' '+esc(p.item.es)+
      ' <button class="sp" data-say="'+esc(p.item.en)+'">🔊 Escuchar</button> <button class="sp nose" data-cn="'+idx+'">🤷 No sé</button><span class="res" id="res'+idx+'"></span></li>';
  });
  html+='</ul></div>'+nextBtn("Continuar →");
  shell(html);bindNext();
  main.querySelectorAll("#grid input").forEach(function(inp){
    inp.onfocus=function(){var ws=CW.cells[inp.dataset.r+","+inp.dataset.c].words;if(ws.indexOf(curDir)<0)curDir=ws[0];inp.select();};
    inp.oninput=function(){
      inp.value=inp.value.replace(/[^a-zA-Z]/g,"").slice(-1).toUpperCase();inp.className="";
      if(!inp.value)return;
      var r=+inp.dataset.r+(curDir==="down"?1:0),c=+inp.dataset.c+(curDir==="across"?1:0);
      var nx=main.querySelector('#grid input[data-r="'+r+'"][data-c="'+c+'"]');if(nx)nx.focus();
      announceWords(+inp.dataset.r,+inp.dataset.c);
    };
  });
  var revealed={},revN=0,announced={};
  function announceWords(r0,c0){
    CW.placed.forEach(function(p){
      if(announced[p.idx]||revealed[p.idx])return;
      var typed="",covers=false;
      for(var i=0;i<p.item.en.length;i++){
        var r=p.r+(p.dir==="down"?i:0),c=p.c+(p.dir==="across"?i:0);
        if(r===r0&&c===c0)covers=true;
        var q=main.querySelector('#grid input[data-r="'+r+'"][data-c="'+c+'"]');typed+=q&&q.value?q.value.toLowerCase():"_";
      }
      if(covers&&typed===p.item.en.toLowerCase()){
        announced[p.idx]=true;
        var el=$("res"+p.idx);if(el){el.className="res ok";el.innerHTML='✅ <b>'+esc(p.item.en)+'</b>';}
        speak(p.item.en,0.85,true);
      }
    });
  }
  main.querySelectorAll("[data-cn]").forEach(function(b){b.onclick=function(){
    var idx=+b.getAttribute("data-cn"),p=CW.placed.filter(function(x){return x.idx===idx;})[0];
    if(!p||revealed[idx])return;revealed[idx]=true;revN++;
    for(var i=0;i<p.item.en.length;i++){
      var r=p.r+(p.dir==="down"?i:0),c=p.c+(p.dir==="across"?i:0);
      var inp=main.querySelector('#grid input[data-r="'+r+'"][data-c="'+c+'"]');
      if(inp){inp.value=p.item.en[i].toUpperCase();inp.className="shown";inp.setAttribute("data-rev","1");}
    }
    var el=$("res"+idx);el.className="res ok";el.innerHTML='🔤 Se escribe: <b>'+esc(p.item.en.toUpperCase())+'</b>';
    b.remove();weakWord(p.item.raw);speak(p.item.en,0.75);
  };});
  $("cwcheck").onclick=function(){
    var all=true;
    main.querySelectorAll("#grid input").forEach(function(inp){
      var sol=CW.cells[inp.dataset.r+","+inp.dataset.c].ch.toUpperCase();
      if(!inp.value){all=false;inp.className="";return;}
      if(inp.value.toUpperCase()===sol)inp.className="ok"+(inp.getAttribute("data-rev")?" shown":"");else{inp.className="bad";all=false;}
    });
    // resultado junto a cada pista: cómo se escribe
    var newWeak=[],wrongWords=[];
    CW.placed.forEach(function(p){
      var typed="",okw=true;
      for(var i=0;i<p.item.en.length;i++){
        var r=p.r+(p.dir==="down"?i:0),c=p.c+(p.dir==="across"?i:0);
        var inp=main.querySelector('#grid input[data-r="'+r+'"][data-c="'+c+'"]');
        var ch=inp&&inp.value?inp.value.toUpperCase():"";
        typed+=ch||"_";if(ch!==p.item.en[i].toUpperCase())okw=false;
      }
      var typedAny=typed.replace(/_/g,"").length>0,wrongLetter=false;
      for(var q=0;q<p.item.en.length;q++){if(typed[q]!=="_"&&typed[q]!==p.item.en[q].toUpperCase())wrongLetter=true;}
      if(!okw&&typedAny&&wrongLetter&&!revealed[p.idx]){wrongWords.push(p.item.en);if(weakWord(p.item.raw))newWeak.push(p.item.en);}
      var el=$("res"+p.idx);
      el.className="res "+(okw?"ok":"bad");
      el.innerHTML=okw?'✅ Se escribe: <b>'+esc(p.item.en.toUpperCase())+'</b>'
                      :'❌ Escribiste <b>'+esc(typed)+'</b> · Se escribe: <b>'+esc(p.item.en.toUpperCase())+'</b>';
    });
    if(wrongWords.length){var snapL=L,wwd=wrongWords[0];setTimeout(function(){if(L===snapL&&soundOn)speakQueued("Oh no! It is "+wwd+".",0.85);},1900);}
    if(all&&!rewarded){
      rewarded=true;
      if(revN===0){addStar(3);CW.placed.forEach(function(p){markKnown({w:p.item.raw});});$("cwfb").innerHTML='<div class="fb ok">🎉 ¡Crucigrama completo! +3 ⭐</div>';}
      else $("cwfb").innerHTML='<div class="fb info">🌱 ¡Terminaste! Las palabras que no sabías quedaron en <b>Repasar lo que no sé</b> 🔁</div>';
    }
    else if(!all){$("cwfb").innerHTML='<div class="fb">Verde = bien, rojo = revisa esa letra. Mira al lado de cada pista cómo se escribe.</div>';if(main.querySelector("#grid input.bad"))sfx(false);}
    if(newWeak.length)$("cwfb").innerHTML+='<div class="fb info" style="margin-top:6px">🔁 Pasaron a tu repaso: <b>'+esc(newWeak.join(", "))+'</b></div>';
  };
  if($("cwnew"))$("cwnew").onclick=function(){R.cross(st);};
};


/* sonido automático al aparecer un acierto o un fallo */
try{
  new MutationObserver(function(muts){
    muts.forEach(function(m){m.addedNodes.forEach(function(n){
      if(n.nodeType!==1)return;
      var hit=(n.matches&&n.matches(".fb.ok,.fb.bad"))?n:(n.querySelector?n.querySelector(".fb.ok,.fb.bad"):null);
      if(n.querySelectorAll||n.hasAttribute)addSlow(n.parentNode?n.parentNode:n);
      if(hit){var ae=document.activeElement;if(ae&&ae.tagName==="INPUT"&&ae.disabled)ae.blur();if(L&&L.exam)examHit(hit.classList.contains("ok"));else sfx(hit.classList.contains("ok"));}
    });});
  }).observe(document.getElementById("main"),{childList:true,subtree:true});
}catch(e){}

/* ===== teclado: Enter = Comprobar / Siguiente ===== */
function visible(el){return !!el&&!el.disabled&&el.offsetParent!==null;}
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter"||e.isComposing||e.repeat)return;
  var t=e.target,tag=t.tagName;
  if(tag==="BUTTON"||tag==="TEXTAREA"||tag==="SELECT"||tag==="A")return;
  if(t.id==="ans"||t.id==="newName")return;                 // estos campos ya manejan Enter
  if(t.id==="pn"){if($("padd")){e.preventDefault();$("padd").click();}return;}
  if(t.id==="rn"){var sv=main.querySelector("[data-save]");if(sv){e.preventDefault();sv.click();}return;}
  var st=document.body.getAttribute("data-st")||"";
  if(visible($("exgo"))){e.preventDefault();$("exgo").click();return;}
  if(visible($("exdone"))){e.preventDefault();$("exdone").click();return;}
  if(visible($("cwcheck"))){e.preventDefault();$("cwcheck").click();return;}
  if(/^(memory|search|match)$/.test(st)&&!(visible($("nxt"))&&$("nxt").classList.contains("green")&&main.querySelector(".fb.ok,.fb.info")))return;
  var nx=$("nxt");
  if(visible(nx)&&nx.classList.contains("green")){e.preventDefault();nx.click();return;}
  var ck=$("chk");
  if(visible(ck)){e.preventDefault();ck.click();}
});
